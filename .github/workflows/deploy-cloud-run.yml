name: Deploy Production to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: mindway-production
  REGION: asia-southeast1
  WORKLOAD_IDENTITY_PROVIDER: projects/275739942525/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SERVICE_ACCOUNT: mindway-github-deploy@mindway-production.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: mindway-runtime@mindway-production.iam.gserviceaccount.com

jobs:
  production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Re-run release gates before deployment
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npm run test:integration
          node scripts/audit-check.js
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=moderate
          docker build -t mindway-mcp:release .

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify pre-provisioned GCP infrastructure
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe mindway-mcp \
            --project="$PROJECT_ID" \
            --location="$REGION" >/dev/null
          gcloud iam service-accounts describe "$RUNTIME_SERVICE_ACCOUNT" \
            --project="$PROJECT_ID" >/dev/null

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable production image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mindway-mcp/server:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy authenticated Cloud Run service
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/mindway-mcp/server:${{ github.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy mindway-mcp \
            --project="$PROJECT_ID" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --no-allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --quiet

      - name: Record deployed service URL
        run: |
          gcloud run services describe mindway-mcp \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)'
