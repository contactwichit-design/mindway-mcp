name: Upgrade Test Toolchain

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade Vitest and regenerate authentic lockfile
        run: |
          set -euo pipefail
          npm install --save-dev vitest@4.1.10
          node -e "const p=require('./package.json'); if(p.devDependencies.vitest!=='^4.1.10' && p.devDependencies.vitest!=='4.1.10') process.exit(1)"
          node -e "const l=require('./package-lock.json'); if(l.lockfileVersion!==3) process.exit(1)"

      - name: Reproducible install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: MCP integration tests
        run: npm run test:integration

      - name: Source and secret audit
        run: node scripts/audit-check.js

      - name: Full dependency audit
        run: npm audit --audit-level=moderate

      - name: Docker build
        run: docker build -t mindway-mcp:qc .

      - name: Container + official MCP client smoke test
        run: |
          set -euo pipefail
          docker run -d --rm -p 8080:8080 --name mindway-qc mindway-mcp:qc
          trap 'docker logs mindway-qc || true; docker stop mindway-qc || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          MINDWAY_MCP_URL=http://127.0.0.1:8080 npm run verify:container

      - name: Commit validated toolchain update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: upgrade test toolchain and refresh lockfile'
          git push origin HEAD:main
